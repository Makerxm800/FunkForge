name: Build & Release

# FunkForge (Beta) is a real Electron app. Each OS builds its own native
# installer on a native runner — Windows .exe, macOS .app/.dmg, Linux AppImage.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Publish a GitHub Release with the built installers"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # Linux (AppImage/deb) is a bonus target and is the most environment
    # sensitive. Let it fail without blocking the Windows/macOS release,
    # which is what most people actually download.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
            kind: win
          - os: macos-latest
            label: macOS
            kind: mac
          - os: ubuntu-latest
            label: Linux
            kind: linux
            optional: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Set up Python (icon generation)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Generate platform icons
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow
          python tools/make_icons.py
          ls -la build/

      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg libarchive-tools rpm || true

      - name: Build ${{ matrix.label }} installer
        run: npm run dist:${{ matrix.kind }}

      - name: List build output
        run: ls -la dist/

      - name: Stage artifacts
        run: |
          mkdir -p out
          # Windows: NSIS setup + portable exe. macOS: dmg + zip. Linux: AppImage + deb.
          for f in dist/*.exe dist/*.dmg dist/*.zip dist/*.AppImage dist/*.deb; do
            [ -f "$f" ] && cp "$f" out/ || true
          done
          echo "--- staged ---"
          ls -la out/
          # A frozen Electron app is always well over 20 MB; anything smaller
          # means the bundler produced something broken.
          for f in out/*; do
            size=$(wc -c < "$f")
            if [ "$size" -lt 10485760 ]; then
              echo "::error::$f is only $size bytes - build looks broken"
              exit 1
            fi
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FunkForge-Beta-${{ matrix.label }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    # `always()` because the optional Linux job is allowed to fail; the step
    # below still refuses to publish unless real installers were produced.
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.make_release)
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers
        run: |
          mkdir -p release
          find artifacts -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \
               -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release/ \;
          ls -la release/
          count=$(find release -type f | wc -l)
          echo "installers: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No installers were produced - refusing to publish."
            exit 1
          fi
          if ! ls release/*.exe release/*.dmg >/dev/null 2>&1; then
            echo "::warning::Neither a Windows .exe nor a macOS .dmg was produced."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          name: "FunkForge (Beta) ${{ github.ref_name }}"
          body: |
            ## FunkForge (Beta) ${{ github.ref_name }}

            A modern **Electron** desktop app for browsing, installing and
            managing *Friday Night Funkin'* mods.

            ### 📦 Download

            | Platform | File | What to do |
            |---|---|---|
            | **Windows 10/11** | `FunkForge-Beta-*-win.exe` | Run the installer |
            | **Windows (portable)** | `FunkForge-Beta-*-portable.exe` | No install — just double-click |
            | **macOS (Intel)** | `FunkForge-Beta-*-x64-mac.dmg` | Open the DMG, drag the app to Applications |
            | **macOS (Apple Silicon)** | `FunkForge-Beta-*-arm64-mac.dmg` | Same as above |
            | **Linux** | `FunkForge-Beta-*.AppImage` | `chmod +x` then run it |
            | **Linux (Debian/Ubuntu)** | `FunkForge-Beta-*.deb` | `sudo apt install ./file.deb` |

            ### ⚠️ First-launch warnings (expected)
            These builds are **unsigned** — code-signing certificates cost
            hundreds of dollars a year, which this free hobby project doesn't
            have. Nothing is wrong with the files.

            - **Windows SmartScreen:** *"Windows protected your PC"* → **More info → Run anyway**
            - **macOS Gatekeeper:** right-click the app → **Open** once, or allow it under
              *System Settings → Privacy & Security*
            - **Linux:** `chmod +x FunkForge-Beta-*.AppImage`

            ### ✨ What's in this release
            - Rewritten from scratch as an **Electron** app — modern UI, 7 themes
            - Discover / Installed / History / Settings
            - Real native folder pickers, OS notifications, custom titlebar
            - Downloads run through a local backend with a disk cache
            - Mods folder is always visible in the sidebar, with Open + Change

            ### 🔒 Privacy
            Talks to **gamebanana.com** and nowhere else. No telemetry,
            no analytics, no accounts, no ads.
