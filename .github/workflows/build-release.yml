name: Build & Release

# Real native builds on real Windows and macOS runners.
# No Electron, no Node, no cross-compilation: each OS builds its own binary.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Publish a GitHub Release with the built files"
        type: boolean
        default: false

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: FunkForge-Beta-Windows-x64
          - os: macos-latest
            artifact: FunkForge-Beta-macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tkinter is available
        run: python -c "import tkinter; print('tkinter', tkinter.TkVersion)"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          python -m pip show pyinstaller | head -3

      - name: Build with PyInstaller
        run: python -m PyInstaller FunkForge.spec --noconfirm --clean

      # ---------------- Windows ----------------
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          EXE="dist/FunkForge (Beta).exe"
          if [ ! -f "$EXE" ]; then
            echo "::error::Expected exe not found at: $EXE"
            ls -la dist
            exit 1
          fi
          mkdir -p staging
          cp "$EXE" "staging/"
          cp README.md License requirements.txt staging/ 2>/dev/null || true
          cd staging
          zip -r "../${{ matrix.artifact }}.zip" . -x '*.DS_Store'
          cd ..
          ls -la "${{ matrix.artifact }}.zip"

      # ---------------- macOS ----------------
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="dist/FunkForge (Beta).app"
          if [ ! -d "$APP" ]; then
            echo "::error::Expected app not found at: $APP"
            ls -la dist
            exit 1
          fi
          # Ad-hoc signature: lets macOS open the app instead of reporting it
          # as damaged. Notarization would need a paid Apple Developer cert.
          codesign --force --deep --sign - "$APP" || echo "codesign skipped"
          codesign --verify --deep --strict "$APP" || echo "verify skipped"

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          BIN="dist/FunkForge (Beta).app/Contents/MacOS/FunkForge (Beta)"
          echo "Binary: $BIN"
          ls -la "$BIN"
          # --help prints usage and exits; proves the frozen Python works.
          timeout 120 "$BIN" --help || echo "::warning::smoke test did not print help"

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create \
            -volname "FunkForge (Beta)" \
            -srcfolder "dist/FunkForge (Beta).app" \
            -ov -format UDZO \
            "${{ matrix.artifact }}.dmg"
          # Also ship a zip for people who prefer not to mount a DMG.
          (cd dist && zip -qr "../${{ matrix.artifact }}.zip" "FunkForge (Beta).app" -x '*.DS_Store')
          ls -la "${{ matrix.artifact }}.dmg" "${{ matrix.artifact }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.dmg
          if-no-files-found: warn

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.zip' -o -name '*.dmg' \) -exec cp {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          name: "FunkForge (Beta) ${{ github.ref_name }}"
          body: |
            ## FunkForge (Beta) - native desktop builds

            Real native applications - **no Electron, no bundled browser**.

            | Platform | File | Notes |
            |---|---|---|
            | Windows 10/11 (64-bit) | `FunkForge-Beta-Windows-x64.zip` | Extract, then run **FunkForge (Beta).exe** |
            | macOS (Apple Silicon + Intel) | `FunkForge-Beta-macOS.dmg` | Open the DMG, drag **FunkForge (Beta).app** to Applications |

            ### First launch notes
            - **Windows:** SmartScreen may say "Windows protected your PC".
              Click **More info -> Run anyway** (the app is unsigned; signing
              certificates cost money).
            - **macOS:** right-click the app -> **Open** the first time, or
              allow it under *System Settings -> Privacy & Security*.

            ### What's inside
            - Browse, search and download Friday Night Funkin' mods from GameBanana
            - Installed-mods manager, profiles, themes, game launcher
            - Built-in web UI (`--web`) available next to the desktop app
